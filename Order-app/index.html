<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cozy Corner - รับออเดอร์</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8B5E3C">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', sans-serif; background: #FDF6EE; color: #3D2B1F; min-height: 100vh; padding-bottom: 70px; }
        
        /* Header */
        .header { background: linear-gradient(135deg, #8B5E3C, #A0522D); color: #fff; padding: 16px; text-align: center; position: sticky; top: 0; z-index: 20; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .header h1 { font-size: 1.4rem; font-weight: 700; }
        .header .subtitle { font-size: 0.75rem; opacity: 0.85; margin-top: 2px; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; display: flex; border-top: 1px solid #e0d5c9; z-index: 20; box-shadow: 0 -2px 8px rgba(0,0,0,0.08); }
        .nav-item { flex: 1; text-align: center; padding: 8px 4px; font-size: 0.65rem; color: #999; cursor: pointer; transition: color 0.2s; }
        .nav-item.active { color: #8B5E3C; font-weight: 700; }
        .nav-item i { font-size: 1.2rem; display: block; margin-bottom: 2px; }

        /* Pages */
        .page { display: none; padding: 16px; max-width: 600px; margin: 0 auto; }
        .page.active { display: block; }

        /* Cards */
        .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); border: 1px solid #f0e6da; }

        /* Sticky Note Style */
        .sticky-note { background: #FFFDE7; border-left: 4px solid #F9A825; border-radius: 4px; padding: 12px 14px; margin-bottom: 10px; box-shadow: 2px 2px 6px rgba(0,0,0,0.08); position: relative; }
        .sticky-note .order-num { font-weight: 700; color: #8B5E3C; font-size: 0.85rem; }
        .sticky-note .order-time { font-size: 0.7rem; color: #999; }
        .sticky-note .order-items { margin-top: 8px; font-size: 0.85rem; line-height: 1.6; }
        .sticky-note .order-items .item-line { display: flex; justify-content: space-between; }
        .sticky-note .order-items .bean-info { font-size: 0.75rem; color: #A0522D; margin-left: 16px; }
        .sticky-note .order-total { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #ccc; font-weight: 700; text-align: right; color: #C62828; }
        .sticky-note .order-note { margin-top: 6px; font-size: 0.8rem; color: #666; font-style: italic; }
        .sticky-note .delete-order { position: absolute; top: 8px; right: 10px; background: none; border: none; color: #ccc; font-size: 1rem; cursor: pointer; }
        .sticky-note .delete-order:hover { color: #e53935; }
        .sticky-note.completed { opacity: 0.5; }
        .sticky-note .complete-btn { background: #4CAF50; color: #fff; border: none; border-radius: 6px; padding: 4px 10px; font-size: 0.75rem; cursor: pointer; margin-top: 6px; }
        .sticky-note .complete-btn.done { background: #999; }

        /* Menu Item Selection */
        .menu-grid { display: grid; gap: 8px; }
        .menu-item-btn { display: flex; justify-content: space-between; align-items: center; background: #fff; border: 2px solid #f0e6da; border-radius: 10px; padding: 10px 14px; cursor: pointer; transition: all 0.15s; }
        .menu-item-btn:active { transform: scale(0.98); }
        .menu-item-btn.selected { border-color: #8B5E3C; background: #FFF8F0; }
        .menu-item-btn .item-name { font-weight: 600; font-size: 0.9rem; }
        .menu-item-btn .item-price { color: #C62828; font-weight: 700; font-size: 0.9rem; }
        .menu-item-btn .qty-controls { display: flex; align-items: center; gap: 8px; }
        .menu-item-btn .qty-controls button { width: 28px; height: 28px; border-radius: 50%; border: 1px solid #ccc; background: #f5f0eb; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; }
        .menu-item-btn .qty-controls button:active { background: #e0d5c9; }
        .menu-item-btn .qty-controls .qty { font-weight: 700; min-width: 20px; text-align: center; }

        /* Bean Selector */
        .bean-selector { margin-top: 6px; padding: 8px 12px; background: #FFF3E0; border-radius: 8px; font-size: 0.8rem; }
        .bean-selector select { width: 100%; padding: 6px; border: 1px solid #ddd; border-radius: 6px; background: #fff; font-size: 0.85rem; margin-top: 4px; }

        /* Section Title */
        .section-title { font-size: 1rem; font-weight: 700; color: #8B5E3C; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .section-title i { font-size: 0.9rem; }

        /* Buttons */
        .btn-primary { width: 100%; background: linear-gradient(135deg, #8B5E3C, #A0522D); color: #fff; border: none; border-radius: 10px; padding: 14px; font-size: 1rem; font-weight: 700; cursor: pointer; box-shadow: 0 2px 8px rgba(139,94,60,0.3); transition: opacity 0.2s; }
        .btn-primary:active { opacity: 0.85; }
        .btn-primary:disabled { background: #ccc; box-shadow: none; }
        .btn-secondary { background: #f5f0eb; color: #8B5E3C; border: 1px solid #e0d5c9; border-radius: 8px; padding: 8px 16px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
        .btn-danger { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; border-radius: 8px; padding: 6px 12px; font-size: 0.8rem; cursor: pointer; }

        /* Form */
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: #666; margin-bottom: 4px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.9rem; background: #fff; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #8B5E3C; box-shadow: 0 0 0 2px rgba(139,94,60,0.15); }

        /* Settings List */
        .settings-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0e6da; }
        .settings-item:last-child { border-bottom: none; }
        .settings-item .item-info { flex: 1; }
        .settings-item .item-info .name { font-weight: 600; font-size: 0.9rem; }
        .settings-item .item-info .price { font-size: 0.8rem; color: #999; }
        .settings-item .item-actions { display: flex; gap: 6px; }
        .settings-item .item-actions button { padding: 4px 10px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.8rem; }
        .edit-btn { background: #E3F2FD; color: #1565C0; }
        .del-btn { background: #FFEBEE; color: #C62828; }

        /* Modal */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 30; justify-content: center; align-items: center; padding: 16px; }
        .modal-overlay.show { display: flex; }
        .modal { background: #fff; border-radius: 16px; padding: 20px; width: 100%; max-width: 400px; max-height: 80vh; overflow-y: auto; }
        .modal h3 { font-size: 1.1rem; margin-bottom: 16px; color: #8B5E3C; }

        /* Daily Summary */
        .summary-bar { display: flex; gap: 8px; margin-bottom: 16px; }
        .summary-card { flex: 1; background: #fff; border-radius: 10px; padding: 10px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border: 1px solid #f0e6da; }
        .summary-card .num { font-size: 1.4rem; font-weight: 700; color: #8B5E3C; }
        .summary-card .label { font-size: 0.65rem; color: #999; margin-top: 2px; }

        /* Tab Buttons */
        .tab-row { display: flex; gap: 6px; margin-bottom: 12px; }
        .tab-btn { flex: 1; padding: 8px; text-align: center; border-radius: 8px; border: 1px solid #e0d5c9; background: #fff; cursor: pointer; font-size: 0.8rem; font-weight: 600; color: #999; }
        .tab-btn.active { background: #8B5E3C; color: #fff; border-color: #8B5E3C; }

        .hidden { display: none !important; }
        .badge { background: #C62828; color: #fff; border-radius: 50%; width: 18px; height: 18px; font-size: 0.65rem; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <h1>☕ Cozy Corner</h1>
        <div class="subtitle">ระบบรับออเดอร์</div>
    </div>

    <!-- Page: Orders (Sticky Notes) -->
    <div id="pageOrders" class="page active">
        <div class="summary-bar">
            <div class="summary-card">
                <div class="num" id="totalOrders">0</div>
                <div class="label">ออเดอร์วันนี้</div>
            </div>
            <div class="summary-card">
                <div class="num" id="totalCups">0</div>
                <div class="label">แก้ว</div>
            </div>
            <div class="summary-card">
                <div class="num" id="totalRevenue">0</div>
                <div class="label">ยอดขาย (฿)</div>
            </div>
        </div>

        <div class="tab-row">
            <div class="tab-btn active" onclick="filterOrders('all')">ทั้งหมด</div>
            <div class="tab-btn" onclick="filterOrders('pending')">กำลังทำ</div>
            <div class="tab-btn" onclick="filterOrders('completed')">เสร็จแล้ว</div>
        </div>

        <div id="ordersList"></div>
    </div>

    <!-- Page: New Order -->
    <div id="pageNewOrder" class="page">
        <div class="section-title"><i class="fas fa-mug-hot"></i> เลือกเมนู</div>
        
        <div class="tab-row" id="categoryTabs"></div>
        <div class="menu-grid" id="menuGrid"></div>

        <div id="orderSummarySection" class="hidden" style="margin-top: 16px;">
            <div class="section-title"><i class="fas fa-receipt"></i> รายการที่เลือก</div>
            <div id="selectedItemsList" class="card" style="padding: 10px 14px;"></div>
        </div>

        <div class="form-group" style="margin-top: 16px;">
            <label><i class="fas fa-sticky-note"></i> หมายเหตุ (ถ้ามี)</label>
            <textarea id="orderNote" rows="2" placeholder="เช่น ลดหวาน, ไม่ใส่น้ำแข็ง..."></textarea>
        </div>

        <button class="btn-primary" id="submitOrderBtn" disabled onclick="submitOrder()">
            <i class="fas fa-check-circle"></i> ยืนยันออเดอร์
        </button>
    </div>

    <!-- Page: Settings -->
    <div id="pageSettings" class="page">
        <div class="tab-row">
            <div class="tab-btn active" onclick="showSettingsTab('menu')">เมนูเครื่องดื่ม</div>
            <div class="tab-btn" onclick="showSettingsTab('beans')">Special Bean</div>
            <div class="tab-btn" onclick="showSettingsTab('categories')">หมวดหมู่</div>
        </div>

        <!-- Menu Items Settings -->
        <div id="settingsMenu">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <div class="section-title" style="margin-bottom: 0;"><i class="fas fa-coffee"></i> เมนูเครื่องดื่ม</div>
                <button class="btn-secondary" onclick="openMenuModal()"><i class="fas fa-plus"></i> เพิ่ม</button>
            </div>
            <div class="card" id="menuSettingsList"></div>
        </div>

        <!-- Special Beans Settings -->
        <div id="settingsBeans" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <div class="section-title" style="margin-bottom: 0;"><i class="fas fa-seedling"></i> Special Bean (เพิ่มราคา)</div>
                <button class="btn-secondary" onclick="openBeanModal()"><i class="fas fa-plus"></i> เพิ่ม</button>
            </div>
            <div class="card" id="beanSettingsList"></div>
        </div>

        <!-- Categories Settings -->
        <div id="settingsCategories" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <div class="section-title" style="margin-bottom: 0;"><i class="fas fa-tags"></i> หมวดหมู่</div>
                <button class="btn-secondary" onclick="openCategoryModal()"><i class="fas fa-plus"></i> เพิ่ม</button>
            </div>
            <div class="card" id="categorySettingsList"></div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchPage('pageOrders', this)">
            <i class="fas fa-clipboard-list"></i> ออเดอร์
        </div>
        <div class="nav-item" onclick="switchPage('pageNewOrder', this)">
            <i class="fas fa-plus-circle"></i> สั่งใหม่
        </div>
        <div class="nav-item" onclick="switchPage('pageSettings', this)">
            <i class="fas fa-sliders-h"></i> ตั้งค่าเมนู
        </div>
    </div>

    <!-- Modal: Add/Edit Menu Item -->
    <div class="modal-overlay" id="menuModal">
        <div class="modal">
            <h3 id="menuModalTitle">เพิ่มเมนูใหม่</h3>
            <form onsubmit="saveMenuItem(event)">
                <input type="hidden" id="editMenuId">
                <div class="form-group">
                    <label>ชื่อเมนู</label>
                    <input type="text" id="menuNameInput" required placeholder="เช่น อเมริกาโน่">
                </div>
                <div class="form-group">
                    <label>ราคา (บาท)</label>
                    <input type="number" id="menuPriceInput" required min="0" step="1" placeholder="50">
                </div>
                <div class="form-group">
                    <label>หมวดหมู่</label>
                    <select id="menuCategoryInput"></select>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="menuIsCoffeeInput" style="width: auto; margin-right: 6px;">
                        เป็นเมนูกาแฟ (เลือก Special Bean ได้)
                    </label>
                </div>
                <div style="display: flex; gap: 8px; margin-top: 16px;">
                    <button type="button" class="btn-secondary" style="flex: 1;" onclick="closeModal('menuModal')">ยกเลิก</button>
                    <button type="submit" class="btn-primary" style="flex: 1;">บันทึก</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Add/Edit Bean -->
    <div class="modal-overlay" id="beanModal">
        <div class="modal">
            <h3 id="beanModalTitle">เพิ่ม Special Bean</h3>
            <form onsubmit="saveBeanItem(event)">
                <input type="hidden" id="editBeanId">
                <div class="form-group">
                    <label>ชื่อ Bean</label>
                    <input type="text" id="beanNameInput" required placeholder="เช่น Columbia pineapple">
                </div>
                <div class="form-group">
                    <label>ราคาเพิ่ม (บาท)</label>
                    <input type="number" id="beanPriceInput" required min="0" step="1" placeholder="10">
                </div>
                <div style="display: flex; gap: 8px; margin-top: 16px;">
                    <button type="button" class="btn-secondary" style="flex: 1;" onclick="closeModal('beanModal')">ยกเลิก</button>
                    <button type="submit" class="btn-primary" style="flex: 1;">บันทึก</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Add Category -->
    <div class="modal-overlay" id="categoryModal">
        <div class="modal">
            <h3>เพิ่มหมวดหมู่ใหม่</h3>
            <form onsubmit="saveCategoryItem(event)">
                <div class="form-group">
                    <label>ชื่อหมวดหมู่</label>
                    <input type="text" id="categoryNameInput" required placeholder="เช่น Smoothie">
                </div>
                <div style="display: flex; gap: 8px; margin-top: 16px;">
                    <button type="button" class="btn-secondary" style="flex: 1;" onclick="closeModal('categoryModal')">ยกเลิก</button>
                    <button type="submit" class="btn-primary" style="flex: 1;">บันทึก</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
</body>
</html>
