<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>บันทึกค่าใช้จ่ายร้านกาแฟ</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8b5a2b">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
        .hidden { display: none !important; }
        .modal { background-color: rgba(0,0,0,0.5); }
    </style>
</head>
<body class="bg-gray-100 pb-20">

    <!-- Header -->
    <header class="bg-yellow-800 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-xl font-bold"><i class="fas fa-coffee mr-2"></i> บัญชีร้านกาแฟ</h1>
        <button id="installBtn" class="hidden bg-white text-yellow-800 px-3 py-1 rounded text-sm font-bold shadow"><i class="fas fa-download mr-1"></i> ติดตั้งแอป</button>
    </header>

    <main class="p-4 max-w-lg mx-auto">
        <!-- Summary Section -->
        <div class="bg-white rounded-lg shadow p-4 mb-6 text-center">
            <h2 class="text-gray-600 text-sm font-semibold mb-1">ยอดรวมค่าใช้จ่ายทั้งหมด</h2>
            <p class="text-3xl font-bold text-red-600" id="totalAmount">฿0.00</p>
        </div>

        <!-- Add Expense Form -->
        <div class="bg-white rounded-lg shadow p-4 mb-6">
            <h2 class="text-lg font-bold mb-4 border-b pb-2"><i class="fas fa-plus-circle text-green-600"></i> เพิ่มรายการใหม่</h2>
            <form id="expenseForm">
                <div class="mb-3">
                    <label class="block text-sm font-medium text-gray-700 mb-1">วันที่</label>
                    <input type="date" id="dateInput" required class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:border-yellow-500 focus:outline-none">
                </div>
                
                <div class="mb-3">
                    <label class="block text-sm font-medium text-gray-700 mb-1">หมวดหมู่</label>
                    <div class="flex gap-2">
                        <select id="categoryInput" required class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:border-yellow-500 focus:outline-none bg-white">
                            <!-- Categories will be loaded here -->
                        </select>
                        <button type="button" id="manageCategoryBtn" class="bg-gray-200 text-gray-700 px-4 rounded-md hover:bg-gray-300 transition" title="จัดการหมวดหมู่"><i class="fas fa-cog"></i></button>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="block text-sm font-medium text-gray-700 mb-1">จำนวนเงิน (บาท)</label>
                    <input type="number" id="amountInput" required min="0" step="0.01" placeholder="0.00" class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:border-yellow-500 focus:outline-none">
                </div>

                <div class="mb-3">
                    <label class="block text-sm font-medium text-gray-700 mb-1">รายละเอียด / หมายเหตุ (เลือกได้)</label>
                    <input type="text" id="noteInput" placeholder="เช่น ซื้อเมล็ดคั่วกลาง 2 กก." class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:border-yellow-500 focus:outline-none">
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">รูปใบเสร็จ (เลือกได้)</label>
                    <input type="file" id="imageInput" accept="image/*" capture="environment" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-yellow-50 file:text-yellow-700 hover:file:bg-yellow-100">
                    <div class="mt-2 relative hidden" id="previewContainer">
                        <img id="imagePreview" class="max-h-40 rounded-md border" src="" alt="Preview">
                        <button type="button" id="removeImgBtn" class="absolute top-1 right-1 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs"><i class="fas fa-times"></i></button>
                    </div>
                </div>

                <button type="submit" class="w-full bg-yellow-800 text-white font-bold py-3 px-4 rounded-md hover:bg-yellow-900 transition shadow"><i class="fas fa-save mr-2"></i> บันทึกข้อมูล</button>
            </form>
        </div>

        <!-- Expense List -->
        <div>
            <h2 class="text-lg font-bold mb-4"><i class="fas fa-list text-yellow-800"></i> ประวัติรายการ</h2>
            <div id="expenseList" class="space-y-3">
                <!-- Items will be loaded here -->
            </div>
        </div>
    </main>

    <!-- Category Management Modal -->
    <div id="categoryModal" class="modal fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-5 max-h-screen flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">จัดการหมวดหมู่</h2>
                <button id="closeModalBtn" class="text-gray-500 hover:text-gray-800 text-2xl px-2">&times;</button>
            </div>
            
            <form id="addCategoryForm" class="flex gap-2 mb-4">
                <input type="text" id="newCategoryInput" required placeholder="เพิ่มหมวดหมู่ใหม่" class="flex-1 border border-gray-300 rounded-md p-2 focus:border-yellow-500 focus:outline-none">
                <button type="submit" class="bg-green-600 text-white px-4 rounded-md hover:bg-green-700"><i class="fas fa-plus"></i></button>
            </form>

            <div class="flex-1 overflow-y-auto" style="max-height: 50vh;">
                <ul id="categoryList" class="space-y-2">
                    <!-- Category items -->
                </ul>
            </div>
        </div>
    </div>

    <!-- Image Modal for viewing receipts -->
    <div id="imageModal" class="modal fixed inset-0 z-50 hidden flex items-center justify-center p-4" onclick="this.classList.add('hidden')">
        <img id="fullImage" src="" class="max-w-full max-h-[90vh] rounded shadow-lg object-contain bg-white p-1">
    </div>

    <script src="app.js"></script>
    <script>
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker Registered!', reg))
                    .catch(err => console.error('Service Worker Registration Failed!', err));
            });
        }
    </script>
</body>
</html>
